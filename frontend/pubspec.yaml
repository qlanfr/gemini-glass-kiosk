# GlassKiosk Copilot - Flutter Dependencies
name: glasskiosk_copilot
description: AI-powered kiosk navigation assistant

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera & Media
  camera: ^0.11.0

  # TTS (Text-to-Speech)
  flutter_tts: ^4.0.2

  # HTTP & WebSocket
  http: ^1.2.0
  web_socket_channel: ^3.0.0

  # State Management
  provider: ^6.1.0

  # Permissions
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
